<!DOCTYPE html> <html lang="en"> <head>   <meta charset="UTF-8" />   <meta name="viewport" content="width=device-width, initial-scale=1.0" />   <title>KERebels – Kyle Edwards Rebels</title>   <style>     * { box-sizing: border-box; margin: 0; padding: 0; }     body {       background: #0f0f0f;       color: #eee;       font-family: system-ui, -apple-system, sans-serif;       height: 100vh;       display: flex;       flex-direction: column;     }     #toolbar {       display: flex;       gap: 8px;       padding: 10px;       background: #1a1a1a;       border-bottom: 1px solid #333;     }     #url {       flex: 1;       padding: 8px 12px;       border: 1px solid #444;       border-radius: 6px;       background: #222;       color: #fff;       font-size: 14px;     }     button {       padding: 8px 16px;       background: #3b82f6;       color: white;       border: none;       border-radius: 6px;       cursor: pointer;       font-weight: 600;     }     button:hover { background: #2563eb; }     #canvas-container {       flex: 1;       display: flex;       justify-content: center;       align-items: center;       overflow: auto;       background: #111;     }     canvas {       background: #000;       cursor: crosshair;       max-width: 100%;       box-shadow: 0 0 20px rgba(0,0,0,0.5);     }     #status {       padding: 6px 12px;       font-size: 12px;       color: #888;       background: #1a1a1a;     }   </style> </head> <body>   <div id="toolbar">     <input id="url" type="text" placeholder="https://example.com" value="https://example.com" />     <button id="go">Go</button>   </div>   <div id="canvas-container">     <canvas id="screen" width="1280" height="720"></canvas>   </div>   <div id="status">Connecting…</div>    <script>     const canvas = document.getElementById('screen');     const ctx = canvas.getContext('2d');     const urlInput = document.getElementById('url');     const goBtn = document.getElementById('go');     const status = document.getElementById('status');      let ws;     let reconnectTimer;      function connect() {       const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';       ws = new WebSocket(`${protocol}//${location.host}`);        ws.onopen = () => {         status.textContent = 'Connected – enter a URL and click Go';         clearTimeout(reconnectTimer);       };        ws.onclose = () => {         status.textContent = 'Disconnected – reconnecting…';         reconnectTimer = setTimeout(connect, 2000);       };        ws.onerror = () => {         status.textContent = 'Connection error';       };        ws.onmessage = (event) => {         try {           const msg = JSON.parse(event.data);           if (msg.type === 'screenshot') {             const img = new Image();             img.onload = () => {               ctx.drawImage(img, 0, 0, canvas.width, canvas.height);             };             img.src = 'data:image/jpeg;base64,' + msg.data;           }         } catch (e) {}       };     }      function sendNavigate() {       if (!ws || ws.readyState !== 1) return;       const url = urlInput.value.trim();       if (!url) return;       ws.send(JSON.stringify({ type: 'navigate', url }));       status.textContent = 'Navigating to ' + url;     }      goBtn.addEventListener('click', sendNavigate);     urlInput.addEventListener('keydown', (e) => {       if (e.key === 'Enter') sendNavigate();     });      // Click forwarding     canvas.addEventListener('click', (e) => {       if (!ws || ws.readyState !== 1) return;       const rect = canvas.getBoundingClientRect();       const scaleX = canvas.width / rect.width;       const scaleY = canvas.height / rect.height;       const x = Math.round((e.clientX - rect.left) * scaleX);       const y = Math.round((e.clientY - rect.top) * scaleY);       ws.send(JSON.stringify({ type: 'click', x, y }));     });      // Optional scroll support     canvas.addEventListener('wheel', (e) => {       if (!ws || ws.readyState !== 1) return;       e.preventDefault();       ws.send(JSON.stringify({ type: 'scroll', deltaY: e.deltaY }));     }, { passive: false });      connect();   </script> </body> </html>
